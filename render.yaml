# Render Blueprint — YaqinDars boti, BEPUL Web Service (plan: free).
# Bepul xizmat 15 daqiqa kiruvchi so'rov bo'lmasa uxlaydi. Shuning uchun:
#   • bot o'zida /health HTTP manzilini ochadi (PORT — Render beradi);
#   • tashqi «uyg'otgich» (cron-job.org va UptimeRobot) har 5 daqiqada /health ni so'raydi
#     → 15 daqiqalik chegaraga hech qachon yetmaydi; zaxira — .github/workflows/keepalive.yml (har 10 daqiqa).
# Oyiga 750 bepul soat — bitta xizmatni 24/7 ishlatishga yetadi (31 kun × 24 = 744).
# Bir vaqtda faqat bitta nusxa polling qiladi (Firestore system/botLock) — deploy paytida ham dublikat bo'lmaydi.
services:
  - type: web
    name: yaqindars-bot
    runtime: docker
    rootDir: bot
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: WEBAPP_URL
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: REQUIRED_CHANNEL
        value: yaqindars_uz
      - key: LOG_LEVEL
        value: INFO
