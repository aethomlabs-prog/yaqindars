<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>YaqinDars</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 120'%3E%3Cpath d='M50 4 C26 4 8 22 8 46 C8 76 50 116 50 116 C50 116 92 76 92 46 C92 22 74 4 50 4 Z' fill='%231E6FD9'/%3E%3Ccircle cx='50' cy='46' r='27' fill='%23fff'/%3E%3Cpath d='M33 37 Q41 32 49 37.5 L49 58 Q41 53 33 57 Z' fill='%231E6FD9'/%3E%3Cpath d='M67 37 Q59 32 51 37.5 L51 58 Q59 53 67 57 Z' fill='%231E6FD9'/%3E%3Ccircle cx='80' cy='16' r='10' fill='%2322B573'/%3E%3C/svg%3E">
<meta name="theme-color" content="#1E6FD9">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="top">
  <div class="brand">
    <svg width="26" height="31" viewBox="0 0 100 120" aria-hidden="true"><path d="M50 4 C26 4 8 22 8 46 C8 76 50 116 50 116 C50 116 92 76 92 46 C92 22 74 4 50 4 Z" fill="#FFFFFF"/><circle cx="50" cy="46" r="27" fill="#1E6FD9"/><path d="M33 37 Q41 32 49 37.5 L49 58 Q41 53 33 57 Z" fill="#FFFFFF"/><path d="M67 37 Q59 32 51 37.5 L51 58 Q59 53 67 57 Z" fill="#FFFFFF"/><circle cx="80" cy="16" r="10" fill="#22B573" stroke="#1E6FD9" stroke-width="4"/></svg>
    <span class="wm">YaqinDars</span>
  </div>
  <button id="locBtn" class="icon-btn" aria-label="Mening joylashuvim">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
  </button>
</header>

<div id="demoBanner" class="demo" hidden>DEMO rejim: namuna ma’lumotlar ko‘rsatilmoqda</div>

<div class="filters">
  <div id="subjects" class="chips" role="group" aria-label="Fanlar"></div>
  <button id="filterBtn" class="filter-btn">Filtr<span id="filterCount" class="count" hidden></span></button>
</div>

<div id="map" aria-label="Xarita"></div>

<section class="list">
  <div class="list-head">
    <span id="countText" class="count-text"></span>
    <label class="toggle"><input type="checkbox" id="freeOnly"> Faqat bo‘sh joy</label>
  </div>
  <div id="cards"></div>
</section>

<!-- Filter -->
<div id="filterSheet" class="overlay" hidden>
  <div class="panel">
    <div class="handle"></div>
    <h2>Filtr</h2>
    <label class="field">
      <span>Oylik narx</span>
      <select id="maxPrice">
        <option value="0">Hammasi</option>
        <option value="200000">200 000 so‘mgacha</option>
        <option value="300000">300 000 so‘mgacha</option>
        <option value="400000">400 000 so‘mgacha</option>
        <option value="500000">500 000 so‘mgacha</option>
      </select>
    </label>
    <div class="field">
      <span>Qaysi kunlari bo‘sh? (dars faqat shu kunlarda bo‘lsin)</span>
      <div id="dayChips" class="chips wrap"></div>
    </div>
    <div class="row-btns">
      <button id="resetFilters" class="btn ghost">Tozalash</button>
      <button data-close class="btn primary">Ko‘rsatish</button>
    </div>
  </div>
</div>

<!-- Center detail -->
<div id="detail" class="overlay" hidden>
  <div class="panel tall" id="detailBody"></div>
</div>

<!-- Apply form -->
<div id="applySheet" class="overlay" hidden>
  <form class="panel" id="applyForm" novalidate>
    <div class="handle"></div>
    <h2>Bepul sinov darsiga yozilish</h2>
    <p id="applyGroup" class="muted"></p>
    <label class="field"><span>O‘quvchi ismi</span><input id="fName" autocomplete="name" maxlength="60" required></label>
    <label class="field"><span>Telefon raqam</span><input id="fPhone" type="tel" inputmode="tel" placeholder="+998 90 123 45 67" maxlength="19" required></label>
    <p id="formErr" class="err" hidden></p>
    <button id="applySubmit" class="btn green" type="submit">Ariza yuborish</button>
  </form>
</div>

<div id="toast" class="toast" role="status" hidden></div>

<script type="module" src="app.js"></script>
</body>
</html>
