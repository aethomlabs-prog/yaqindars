<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#F2F2F7" />
    <meta name="description" content="YaqinDars — uyingizga yaqin o‘quv markazlari, to‘garaklar va repetitorlar." />
    <title>YaqinDars</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="YaqinDars" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Shrift sahifani kutdirmaydi: yuklanguncha tizim shrifti -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'" />
    <!-- Telegram SDK o‘z saytimizdan (telegram.org dan 5–10 s ketardi va sahifani to‘xtatib turardi) -->
    <script src="./telegram-web-app.js" defer></script>
    <script>
      // Mavzuni birinchi kadrdan oldin qo‘yamiz (oq «miltillash» bo‘lmasin)
      (function () {
        try {
          var pref = JSON.parse(localStorage.getItem("yd-settings") || "{}").state || {};
          var t = pref.theme || "auto";
          var tg = window.Telegram && window.Telegram.WebApp;
          var dark = t === "dark" || (t === "auto" && (tg && tg.initData ? tg.colorScheme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches));
          document.documentElement.dataset.theme = dark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <!-- Birinchi kadr: animatsiyali loading bilan bir xil ko‘k fon (oq/bo‘sh ekran va «qotish» bo‘lmasin) -->
    <div id="boot" style="position: fixed; inset: 0; z-index: 9998; background: #1e6fd9"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
